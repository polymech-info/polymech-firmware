#########################################################################
# This file is used to set the path to configuration directories.
#########################################################################
# Text after '#' is ignored as comment.
#
# Variables is defined like this:
# VARIABLE = <path>
#
# You can reuse a variable by placing '%' around it like so: %VARIABLE%
# '%' is only allowed for variables, directories containing '%' are invalid.
#
# Special variables:
# %VENDORDIR% resolves to "<vendor>"
# %PRODUCTDIR% resolves to "<program name><major version>"
# %EXEDIR% resolves to "<path to program.exe>"
#
# Windows environment variables are resolved after the special variables
# %APPDATA% resolves to "C:\Users\<username>\AppData\Roaming"
#
# Required variables:
# ROOTDIR, CFG, DATA, MACHINES, TYPES, TOOLLIBS, LOG
#
# Default values:
# ROOTDIR   = %APPDATA%\%VENDORDIR%\%PRODUCTDIR%
# CFG       = %ROOTDIR%\Cfg
# DATA      = %ROOTDIR%\Data 
# MACHINES  = %ROOTDIR%\Machines
# TYPES     = %ROOTDIR%\Types
# TOOLLIBS  = %ROOTDIR%\ToolLibs
# LOG       = %ROOTDIR%\Log
#########################################################################

ROOTDIR   = %APPDATA%\%VENDORDIR%\%PRODUCTDIR%
CFG       = %ROOTDIR%\Cfg
DATA      = %ROOTDIR%\Data 
MACHINES  = %ROOTDIR%\Machines
TYPES     = %ROOTDIR%\Types
TOOLLIBS  = %ROOTDIR%\ToolLibs
LOG       = %ROOTDIR%\Log